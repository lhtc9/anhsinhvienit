<link rel="icon" href="https://i.pinimg.com/736x/19/93/19/19931936b5fdb3f644e439aa99ed95f3.jpg">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial;
}

body {
  background: #f5f5f5;
  position: relative;
  overflow-x: hidden;
}

/* HEADER */
header {
  background: #ff6a00;
  padding: 12px;
  position: sticky;
  top: 0;
}

.search-box {
  background: white;
  border-radius: 20px;
  padding: 10px 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.search-box input {
  border: none;
  outline: none;
  width: 100%;
  font-size: 14px;
}

/* BANNER */
.banner {
  height: 160px;
  background: linear-gradient(135deg, #ff6a00, #ff9a00);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: white;
}

.banner-content h2 {
  font-size: 22px;
  margin-bottom: 5px;
}

.banner-content p {
  font-size: 14px;
  margin-bottom: 10px;
  opacity: 0.9;
}

/* NÚT */
.banner-btn {
  display: inline-block;
  background: white;
  color: #ff6a00;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  text-decoration: none;
  font-weight: bold;
}

.banner-btn:hover {
  background: #ffe0cc;
}

/* CATEGORY */
.category {
  display: flex;
  overflow-x: auto;
  background: white;
  padding: 10px;
  gap: 10px;
  border-bottom: 1px solid #eee;
}

.cat-item {
  padding: 6px 12px;
  background: #fff3e6;
  border-radius: 15px;
  font-size: 12px;
  cursor: pointer;
}

.cat-item:hover {
  background: #ffe0cc;
}

/* PRODUCT GRID */
.container {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 10px;
}

/* CARD */
.card {
  background: white;
  border-radius: 10px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  transition: 0.2s;
}

.card:hover {
  transform: translateY(-3px);
}

/* BADGE */
.badge {
  position: absolute;
  top: 5px;
  left: 5px;
  background: #ff3b30;
  color: white;
  font-size: 10px;
  padding: 3px 5px;
  border-radius: 5px;
}

/* IMAGE */
.card img {
  width: 100%;
  height: 180px; /*khung ảnh sp */
  object-fit: cover;
}

/* INFO */
.info {
  padding: 8px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.title {
  font-size: 13px;
  color: #333;
  line-height: 1.4;

  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;

  overflow: hidden;
}

/* BUTTON GROUP */
.btn-group {
  display: flex;
  gap: 5px;
}

/* BUTTON GROUP */
.btn-group {
  display: flex;
  gap: 5px;
}

/* BUTTON */
.btn {
  flex: 1;
  text-align: center;
  padding: 6px;
  font-size: 12px;
  border-radius: 6px;
  text-decoration: none;
  color: white;
  font-weight: bold;
}

.tiktok {
  background: linear-gradient(135deg, #ff6a00, #ff9a00);
  color: white;
  border-radius: 10px;
  font-weight: bold;
  box-shadow: 0 4px 10px rgba(255,106,0,0.3);
}

/* HOVER */
.btn:hover {
  opacity: 0.9;
}

/* PRODUCT GRID */
.container {
  display: grid;
  grid-template-columns: repeat(2, 1fr); /* mặc định mobile */
  gap: 10px;
  padding: 10px;
}

/* Tablet */
@media (min-width: 600px) {
  .container {
    grid-template-columns: repeat(3, 1fr);
  }
}

/* Laptop */
@media (min-width: 992px) {
  .container {
    grid-template-columns: repeat(4, 1fr);
  }
}

/* Màn hình lớn */
@media (min-width: 1200px) {
  .container {
    grid-template-columns: repeat(5, 1fr);
  }
}

#backToTop {
  position: fixed;
  bottom: 20px;
  right: 20px;
  left: auto; /* thêm dòng này */
  background: #ff6a00;
  color: white;
  border: none;
  border-radius: 50%;
  width: 45px;
  height: 45px;
  font-size: 18px;
  cursor: pointer;
  display:block;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  z-index: 9999;
}

#backToTop:hover {
  background: #e65c00;
}

/* HEADER SHOP STYLE */
.shop-header {
  height: 180px;
  background: url('https://i.pinimg.com/736x/93/c5/74/93c574e5c97a9e4e1eb65cb61216307b.jpg') center/cover no-repeat;
  position: relative;
  color: white;
}

.shop-info h2 {
  text-shadow: 0 2px 5px rgba(0,0,0,0.5);
}

.overlay {
  background:transparent;
  height: 100%;
  padding: 10px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

/* TOP BAR */
.top-bar {
  display: flex;
  justify-content: space-between;
  font-size: 20px;
}

/* SHOP INFO */
.shop-info {
  text-align: center;
}

.avatar {
  width: 55px;
  height: 55px;
  border-radius: 50%;
  border: 2px solid white;
  margin-bottom: 5px;
}

/* SEARCH */
.shop-header .search-box {
  background: white;
  border-radius: 20px;
  padding: 8px 12px;
}

.shop-header input {

  border: none;

}

#particles-js {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* đảm bảo nội dung nằm trên hiệu ứng */
header, .category, .container{
  position: relative;
  z-index: 1;
}
</style>

const container = document.getElementById("productList");

function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function render(list) {
  container.innerHTML = "";
  list.forEach(p => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      ${p.hot ? '<div class="badge">HOT</div>' : ''}
      <img src="${p.img}">
      <div class="info">
        <div class="title">${p.name}</div>
        <div class="price">
</div>
        <div class="btn-group">
          <a href="${p.linkTikTok}" target="_blank" class="btn tiktok">Xem giá ưu đãi</a>
        </div>
      </div>
    `;

    container.appendChild(card);
  });
}

function filter(cat) {
  if (cat === "all") return render(products);
  render(products.filter(p => p.category === cat));
}

function searchProduct(keyword) {
  const result = products.filter(p =>
    p.name.toLowerCase().includes(keyword.toLowerCase())
  );
  render(result);
}

render(shuffleArray([...products]));
const btn = document.getElementById("backToTop");

// hiện nút khi scroll xuống
window.onscroll = function () {
  if (document.documentElement.scrollTop > 200) {
    btn.style.display = "block";
  } else {
    btn.style.display = "none";
  }
};

// click → lên đầu trang

<script>
tsParticles.load("particles-js", {

    color: "transparent"
  },
  particles: {
    number: {
      value: 35
    },
    color: {

    },
    links: {
      enable: true,
      color: "#ff6a00",
      distance: 140,
      opacity: 0.5
    },
    move: {
      enable: true,
      speed: 1
    },
    size: {
      value: 2
    },
    opacity: {
      value: 0.6
    }
  }
});
  const isDev = false; // true test, false publish

if (!isDev) {
  document.addEventListener("contextmenu", e => e.preventDefault());

  document.onkeydown = function(e) {
    if (e.key === "F12") return false;
  };
},
  document.onkeydown = function(e) {
  // chặn Ctrl + U
  if (e.ctrlKey && e.key.toLowerCase() === "u") return false;

  // chặn F12
  if (e.key === "F12") return false;

  // chặn Ctrl + Shift + I
  if (e.ctrlKey && e.shiftKey && e.key === "I") return false;
}
</script>
